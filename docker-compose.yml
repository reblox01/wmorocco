version: "3.9"

services:
  app:
    build: .
    container_name: wmorocco_app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Fallback values if .env is not provided
      - DATABASE_URL=mongodb://mongo:27017/wmorocco?retryWrites=true&w=majority
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=changeme
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: wmorocco_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: 